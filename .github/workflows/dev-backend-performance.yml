name: Dev backend performance baseline

# MANUAL EXECUTION ONLY - workflow_dispatch is the only permitted trigger.
#
# Do not add push, pull_request, or schedule triggers to this workflow.
#
# Why this must never run automatically:
#   * It authenticates against the isolated dev backend using real test-account
#     secrets, so every run exercises authenticated dev state.
#   * The controlled-write scenario mutates dev data (it saves and then deletes
#     a synthetic push token), so runs are not side-effect free.
#   * Load is applied to a shared dev deployment; unattended runs can collide
#     with other testing or deployments.
#
# Artifact handling:
#   k6 writes the value returned by the test's setup() function into every
#   --summary-export file under "setup_data", and that has previously included
#   a live access token. Raw results are therefore sanitized and then verified
#   before upload. Log masking alone is NOT sufficient: ::add-mask:: redacts
#   console output but does not alter files written to disk or uploaded as
#   artifacts. If the verification step finds credential-shaped content, the
#   upload is skipped and the job fails closed.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-backend-performance
  cancel-in-progress: false

jobs:
  baseline:
    name: Isolated dev backend baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev
    env:
      BASE_URL: ${{ vars.STAGING_BACKEND_URL }}
      EXPECTED_DEV_HOST: yeshmishak-dev.up.railway.app
      PRODUCTION_BACKEND_HOSTS: ${{ vars.PRODUCTION_BACKEND_HOSTS }}
      STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
      STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
      K6_IMAGE: grafana/k6:2.0.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate isolated dev configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BASE_URL:-}"
          test -n "${PRODUCTION_BACKEND_HOSTS:-}"
          test -n "${STAGING_TEST_EMAIL:-}"
          test -n "${STAGING_TEST_PASSWORD:-}"
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          parsed = urlparse(os.environ["BASE_URL"])
          expected = os.environ["EXPECTED_DEV_HOST"]
          production = {
              value.strip().lower()
              for value in os.environ["PRODUCTION_BACKEND_HOSTS"].split(",")
              if value.strip()
          }
          if parsed.scheme != "https" or parsed.hostname != expected:
              raise SystemExit("Configured backend is not the exact isolated dev host")
          if parsed.hostname.lower() in production:
              raise SystemExit("Refusing production backend host")
          print("Isolated dev host validation passed.")
          PY

      - name: Record tool and target metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/load_tests/results
          chmod 777 backend/load_tests/results
          docker pull "${K6_IMAGE}"
          docker run --rm "${K6_IMAGE}" version | tee backend/load_tests/results/k6-version.txt
          {
            echo "tested_commit_sha=${GITHUB_SHA}"
            echo "tested_branch=${GITHUB_REF_NAME}"
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "target_host=${EXPECTED_DEV_HOST}"
            echo "railway_deployment_id=requires_dashboard_capture"
            echo "started_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > backend/load_tests/results/metadata.txt
          curl --fail --silent --show-error --dump-header \
            backend/load_tests/results/initial-health-headers.txt \
            --output backend/load_tests/results/initial-health-body.json \
            --max-time 20 "${BASE_URL}/"

      - name: Run three comparable trials per primary scenario
        id: primary
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          script="/work/backend/load_tests/dev_backend_baseline.js"
          container_result_root="/work/backend/load_tests/results"
          host_result_root="${GITHUB_WORKSPACE}/backend/load_tests/results"
          failures=0

          run_case() {
            local scenario="$1"
            local run_number="$2"
            local run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${scenario}-${run_number}"
            local container_prefix="${container_result_root}/${scenario}-run-${run_number}"
            local host_prefix="${host_result_root}/${scenario}-run-${run_number}"

            set +e
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "${GITHUB_WORKSPACE}:/work" \
              -e BASE_URL \
              -e EXPECTED_DEV_HOST \
              -e PRODUCTION_BACKEND_HOSTS \
              -e STAGING_TEST_EMAIL \
              -e STAGING_TEST_PASSWORD \
              -e SCENARIO="${scenario}" \
              -e TEST_RUN_ID="${run_id}" \
              "${K6_IMAGE}" run \
              --summary-export "${container_prefix}-summary.json" \
              --out "json=${container_prefix}-points.json" \
              "${script}" 2>&1 | tee "${host_prefix}-console.log"
            local code="${PIPESTATUS[0]}"
            set -e
            echo "${code}" > "${host_prefix}-exit-code.txt"
            if [[ "${code}" -ne 0 ]]; then
              failures=$((failures + 1))
            fi
          }

          for scenario in public-read authenticated-read controlled-write; do
            for run_number in 1 2 3; do
              run_case "${scenario}" "${run_number}"
            done
          done

          echo "${failures}" > backend/load_tests/results/primary-failure-count.txt
          exit "${failures}"

      - name: Run edge and pressure scenarios
        id: edge
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          script="/work/backend/load_tests/dev_backend_baseline.js"
          container_result_root="/work/backend/load_tests/results"
          host_result_root="${GITHUB_WORKSPACE}/backend/load_tests/results"
          failures=0

          run_case() {
            local scenario="$1"
            local run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${scenario}"
            local container_prefix="${container_result_root}/${scenario}"
            local host_prefix="${host_result_root}/${scenario}"

            set +e
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "${GITHUB_WORKSPACE}:/work" \
              -e BASE_URL \
              -e EXPECTED_DEV_HOST \
              -e PRODUCTION_BACKEND_HOSTS \
              -e STAGING_TEST_EMAIL \
              -e STAGING_TEST_PASSWORD \
              -e SCENARIO="${scenario}" \
              -e TEST_RUN_ID="${run_id}" \
              "${K6_IMAGE}" run \
              --summary-export "${container_prefix}-summary.json" \
              --out "json=${container_prefix}-points.json" \
              "${script}" 2>&1 | tee "${host_prefix}-console.log"
            local code="${PIPESTATUS[0]}"
            set -e
            echo "${code}" > "${host_prefix}-exit-code.txt"
            if [[ "${code}" -ne 0 ]]; then
              failures=$((failures + 1))
            fi
          }

          run_case invalid-auth
          run_case connection-pressure
          echo "${failures}" > backend/load_tests/results/edge-failure-count.txt
          exit "${failures}"

      - name: Sanitize raw evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import re

          results = pathlib.Path("backend/load_tests/results")

          # k6 persists the setup() return value into every summary export.
          # It carries the access token used by the authenticated scenarios,
          # so drop the whole block rather than trying to filter keys.
          for summary in sorted(results.glob("*-summary.json")):
              data = json.loads(summary.read_text(encoding="utf-8"))
              if data.pop("setup_data", None) is not None:
                  summary.write_text(
                      json.dumps(data, indent=2, sort_keys=True),
                      encoding="utf-8",
                  )
                  print(f"removed setup_data from {summary.name}")

          # Per-request infrastructure trace identifiers.
          headers = results / "initial-health-headers.txt"
          if headers.exists():
              redacted = re.sub(
                  r"(?im)^(x-railway-request-id|x-request-id|x-hikari-trace):.*$",
                  lambda m: f"{m.group(1)}: [redacted]",
                  headers.read_text(encoding="utf-8"),
              )
              headers.write_text(redacted, encoding="utf-8")
              print("redacted trace identifiers from initial-health-headers.txt")
          PY

      - name: Verify raw evidence contains no credentials
        id: sanitization
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import re
          import sys

          results = pathlib.Path("backend/load_tests/results")

          # JWT-shaped strings and bearer headers. Report file names and match
          # counts only - never the matched value itself.
          patterns = {
              "jwt": re.compile(rb"eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}"),
              "bearer header": re.compile(rb"(?i)authorization\s*:\s*bearer\s+\S"),
              "setup_data block": re.compile(rb'"setup_data"'),
          }

          offenders = []
          for path in sorted(results.rglob("*")):
              if not path.is_file():
                  continue
              blob = path.read_bytes()
              for label, pattern in patterns.items():
                  hits = pattern.findall(blob)
                  if hits:
                      offenders.append((path.name, label, len(hits)))

          if offenders:
              for name, label, count in offenders:
                  print(f"::error::{name}: {count} {label} match(es)")
              print("::error::Credential-shaped content found; artifact upload will be skipped.")
              sys.exit(1)

          print("Sanitization verified: no credential-shaped content in raw results.")
          PY

      - name: Upload raw performance evidence
        # Fail closed: never upload when sanitization did not verify clean.
        if: always() && steps.sanitization.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dev-backend-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/load_tests/results
          retention-days: 30
          if-no-files-found: error

      - name: Enforce benchmark gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          primary_failures="$(cat backend/load_tests/results/primary-failure-count.txt 2>/dev/null || echo 1)"
          edge_failures="$(cat backend/load_tests/results/edge-failure-count.txt 2>/dev/null || echo 1)"
          if [[ "${primary_failures}" != "0" || "${edge_failures}" != "0" ]]; then
            echo "::error::One or more k6 scenarios failed thresholds or contracts."
            exit 1
          fi
